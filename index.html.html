<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Crimson+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#08080E;--ink2:#0E0E1A;--ink3:#141420;
  --parchment:#F0EEF8;--parchment-dim:rgba(240,238,248,0.85);
  --gold:#C9A84C;--gold-pale:rgba(201,168,76,0.1);
}
html,body{height:100%;background:var(--ink);font-family:'Crimson Pro',serif;color:var(--parchment);overflow:hidden}

/* HEADER */
#header{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(8,8,14,0.95);backdrop-filter:blur(8px);border-bottom:1px solid rgba(201,168,76,0.12);padding:0 16px;height:52px;display:flex;align-items:center}
#header h1{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--gold);font-weight:400;letter-spacing:3px}

/* TRIP LIST */
#trip-list{position:fixed;top:52px;left:0;right:0;bottom:0;overflow-y:auto;padding:16px 16px 40px;scrollbar-width:thin;scrollbar-color:rgba(255,213,90,0.45) transparent}

/* TRIP CARD */
.trip-card{border-radius:14px;overflow:hidden;margin-bottom:16px;cursor:pointer;position:relative;border:1px solid rgba(201,168,76,0.12);transition:transform .2s}
.trip-card:active{transform:scale(0.98)}
.trip-hero{width:100%;height:180px;position:relative;overflow:hidden}
.trip-hero-bg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:5rem}
.trip-hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(8,8,14,0.1) 0%,rgba(8,8,14,0.7) 100%)}
.trip-hero-content{position:absolute;bottom:0;left:0;right:0;padding:14px 16px}
.trip-name{font-family:'Playfair Display',serif;font-size:1.4rem;color:white;font-weight:400;letter-spacing:1px}
.trip-dates{font-size:0.75rem;color:rgba(255,255,255,0.6);letter-spacing:2px;text-transform:uppercase;margin-top:2px}
.trip-countdown{position:absolute;top:12px;right:12px;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);border:1px solid rgba(255,213,90,0.55);border-radius:8px;padding:6px 10px;text-align:center}
.trip-countdown-num{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--gold);line-height:1}
.trip-countdown-label{font-size:0.6rem;color:rgba(255,213,90,0.75);letter-spacing:1px;text-transform:uppercase}
.trip-footer{padding:12px 16px;background:var(--ink2);display:flex;gap:8px;flex-wrap:wrap}
.trip-place-chip{font-size:0.75rem;color:var(--parchment-dim);background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:3px 10px}

/* TRIP DETAIL */
#trip-detail{position:fixed;inset:0;z-index:200;background:var(--ink);transform:translateX(100%);transition:transform .32s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow:hidden}
#trip-detail.open{transform:translateX(0)}
#detail-header{padding:12px 16px;border-bottom:1px solid rgba(201,168,76,0.12);display:flex;align-items:center;gap:12px;flex-shrink:0;background:var(--ink)}
#detail-back{background:none;border:none;color:var(--gold);font-size:1.3rem;cursor:pointer;padding:4px}
#detail-trip-name{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--parchment);font-weight:400}
#detail-trip-sub{font-size:0.72rem;color:rgba(255,213,90,0.65);letter-spacing:2px;text-transform:uppercase;margin-top:2px}

/* DETAIL TABS */
#detail-tab-bar{display:flex;background:var(--ink);border-bottom:1px solid rgba(201,168,76,0.1);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
#detail-tab-bar::-webkit-scrollbar{display:none}
.dtab{flex-shrink:0;padding:9px 14px;background:none;border:none;border-bottom:2px solid transparent;font-family:'Crimson Pro',serif;font-size:0.75rem;letter-spacing:1px;text-transform:uppercase;color:rgba(255,213,90,0.55);cursor:pointer;transition:all .2s;white-space:nowrap}
.dtab.active{color:var(--gold);border-bottom-color:var(--gold)}
#detail-content{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,213,90,0.45) transparent}
.dtab-view{display:none;padding:16px 16px 60px}

/* HIGHLIGHTS */
.place-section{margin-bottom:20px}
.place-name{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--gold-pale);color:var(--gold);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid rgba(201,168,76,0.12)}
.highlight-item{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.hi-dot{width:5px;height:5px;border-radius:50%;background:var(--gold);flex-shrink:0;margin-top:7px;opacity:0.5}
.hi-text{font-size:0.85rem;color:var(--parchment-dim);line-height:1.5}
.hi-text strong{color:rgba(240,238,248,0.8)}
.alert-box{background:rgba(201,168,76,0.08);border:1px solid rgba(255,213,90,0.45);border-left:3px solid var(--gold);border-radius:0 8px 8px 0;padding:10px 12px;margin-bottom:12px;font-size:0.8rem;color:rgba(255,213,90,0.88);line-height:1.5}

/* READINESS */
#readiness-area{width:100%;min-height:200px;background:rgba(201,168,76,0.04);border:1px solid rgba(201,168,76,0.12);border-radius:8px;padding:12px;color:var(--parchment);font-family:'Crimson Pro',serif;font-size:0.9rem;resize:none;outline:none;line-height:1.6}
#readiness-area::placeholder{color:rgba(255,213,90,0.4)}
#readiness-save{margin-top:8px;padding:8px 20px;background:var(--gold-pale);border:1px solid rgba(255,213,90,0.5);border-radius:8px;color:var(--gold);font-family:'Crimson Pro',serif;font-size:0.85rem;cursor:pointer;letter-spacing:1px}

/* BOOKINGS */
.booking-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--ink2);border:1px solid rgba(201,168,76,0.08);border-radius:8px;margin-bottom:8px;cursor:pointer;transition:all .2s}
.booking-check{width:20px;height:20px;border-radius:4px;border:2px solid rgba(255,213,90,0.5);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s}
.booking-check.done{background:var(--gold);border-color:var(--gold)}
.booking-check.done::after{content:'✓';font-size:0.7rem;color:var(--ink);font-weight:700}
.booking-text{flex:1;font-size:0.88rem;color:var(--parchment-dim);line-height:1.3}
.booking-item.done-item .booking-text{text-decoration:line-through;color:rgba(240,238,248,0.65)}
.booking-priority{font-size:0.65rem;letter-spacing:1px;padding:2px 7px;border-radius:4px;flex-shrink:0}
.booking-priority.high{background:rgba(192,57,43,0.15);color:#E57373;border:1px solid rgba(192,57,43,0.2)}
.booking-priority.med{background:rgba(201,168,76,0.1);color:rgba(255,213,90,0.82);border:1px solid rgba(255,213,90,0.4)}

/* TOAST */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink2);border:1px solid rgba(255,213,90,0.55);color:var(--gold);padding:9px 18px;border-radius:20px;font-size:0.85rem;opacity:0;transition:all .3s;pointer-events:none;z-index:999;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── EXPORT/IMPORT ── */
#ei-btn{background:none;border:none;color:rgba(255,213,90,0.6);font-size:1.1rem;cursor:pointer;padding:4px 8px;transition:color .2s;flex-shrink:0}
#ei-btn:active{color:var(--gold)}
#ei-overlay{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,0.88);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s}
#ei-overlay.show{opacity:1;pointer-events:all}
#ei-box{width:100%;background:#1A1208;border-top:1px solid rgba(255,213,90,0.5);border-radius:20px 20px 0 0;padding:24px 20px 40px;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1)}
#ei-overlay.show #ei-box{transform:translateY(0)}
.ei-title{font-family:'Playfair Display',serif;font-size:1.05rem;color:var(--gold,#C9A84C);margin-bottom:6px}
.ei-sub{font-size:0.78rem;color:rgba(255,213,90,0.65);margin-bottom:18px;line-height:1.5}
.ei-btn-row{display:flex;gap:10px;margin-bottom:16px}
.ei-action-btn{flex:1;padding:11px;border-radius:8px;font-family:'Playfair Display',serif;font-size:0.9rem;cursor:pointer;transition:all .2s}
.ei-export-btn{background:rgba(255,213,90,0.4);border:1px solid rgba(255,213,90,0.55);color:#FFD55A}
.ei-import-btn{background:rgba(42,184,100,0.1);border:1px solid rgba(42,184,100,0.3);color:#4CAF50}
#ei-code-area{width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(255,213,90,0.45);border-radius:8px;padding:10px;color:rgba(245,237,216,0.7);font-family:monospace;font-size:0.72rem;resize:none;outline:none;min-height:80px;line-height:1.4;margin-bottom:10px;word-break:break-all}
#ei-code-area::placeholder{color:rgba(255,213,90,0.4)}
.ei-code-action-row{display:flex;gap:8px}
.ei-copy-btn{flex:1;padding:9px;background:rgba(201,168,76,0.1);border:1px solid rgba(255,213,90,0.45);border-radius:8px;color:rgba(255,213,90,0.88);font-family:'Crimson Pro',serif;font-size:0.85rem;cursor:pointer}
.ei-confirm-btn{flex:1;padding:9px;background:rgba(42,184,100,0.15);border:1px solid rgba(42,184,100,0.3);border-radius:8px;color:#4CAF50;font-family:'Crimson Pro',serif;font-size:0.85rem;cursor:pointer;display:none}
.ei-close-btn{padding:9px 20px;background:none;border:1px solid rgba(255,213,90,0.4);border-radius:8px;color:rgba(255,213,90,0.65);font-family:'Crimson Pro',serif;font-size:0.85rem;cursor:pointer}

/* GALLERY */
.gallery-place{margin-bottom:20px}
.gallery-place-name{font-family:'Playfair Display',serif;font-size:0.95rem;color:var(--gold);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid rgba(201,168,76,0.12)}
.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px}
.gallery-cell{aspect-ratio:1;border-radius:6px;overflow:hidden;position:relative;background:rgba(201,168,76,0.05);border:1px dashed rgba(255,213,90,0.4);display:flex;align-items:center;justify-content:center;cursor:pointer}
.gallery-cell img{width:100%;height:100%;object-fit:cover}
.gallery-cell .add-icon{font-size:1.5rem;opacity:0.25}
.gallery-cell .del-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;color:white;font-size:1.2rem}
.gallery-cell:active .del-overlay{display:flex}
</style>
</head>
<body>

<div id="header"><h1>Horizon</h1><button id="ei-btn" onclick="eiOpen()" title="Backup data">⬆⬇</button></div>

<div id="trip-list">
  <!-- cards injected by JS -->
</div>

<div id="trip-detail">
  <div id="detail-header">
    <button id="detail-back" onclick="closeDetail()">←</button>
    <div>
      <div id="detail-trip-name"></div>
      <div id="detail-trip-sub"></div>
    </div>
  </div>
  <div id="detail-tab-bar">
    <button class="dtab active" onclick="showDTab('highlights')">Highlights</button>
    <button class="dtab" onclick="showDTab('gallery')">Gallery</button>
    <button class="dtab" onclick="showDTab('readiness')">Readiness</button>
    <button class="dtab" onclick="showDTab('bookings')">Bookings</button>
  </div>
  <div id="detail-content">
    <div class="dtab-view" id="dtab-highlights"></div>
    <div class="dtab-view" id="dtab-gallery"></div>
    <div class="dtab-view" id="dtab-readiness">
      <div class="section-title" style="font-size:0.65rem;letter-spacing:3px;text-transform:uppercase;color:rgba(255,213,90,0.6);margin-bottom:12px">How ready do you feel?</div>
      <textarea id="readiness-area" rows="8" placeholder="Fitness level, bookings progress, excitement, concerns — anything relevant to how prepared you feel for this trip…"></textarea>
      <button id="readiness-save" onclick="saveReadiness()">Save</button>
    </div>
    <div class="dtab-view" id="dtab-bookings"></div>
  </div>
</div>

<div id="toast"></div>

<script>
const TRIPS = [
  {

    targetDate: '2026-10-01',

    highlights: [

        {text:'Fly on evening of Day 2 to Tokyo'}

      {place:'Tokyo', items:[

// STORAGE
const KEY='horizon_v2';
function ld(){return JSON.parse(localStorage.getItem(KEY)||'{}')}
function sv(d){localStorage.setItem(KEY,JSON.stringify(d))}

// COUNTDOWN
function daysUntil(dateStr){
  const d=new Date(dateStr);const t=new Date();t.setHours(0,0,0,0);
  return Math.max(0,Math.ceil((d-t)/(1000*60*60*24)));
}

// RENDER TRIP LIST
function renderList(){
  const list=document.getElementById('trip-list');
  list.innerHTML=TRIPS.map(trip=>{
    const days=daysUntil(trip.targetDate);
    return `<div class="trip-card" onclick="openTrip('${trip.id}')">
      <div class="trip-hero">
        <div class="trip-hero-bg" style="background:linear-gradient(135deg,${trip.color}33,${trip.color}11)">${trip.emoji}</div>
        <div class="trip-hero-overlay"></div>
        <div class="trip-hero-content">
          <div class="trip-name">${trip.name}</div>
          <div class="trip-dates">${trip.dates}</div>
        </div>
        <div class="trip-countdown">
          <div class="trip-countdown-num">${days}</div>
          <div class="trip-countdown-label">days</div>
        </div>
      </div>
      <div class="trip-footer">
        ${trip.places.map(p=>`<div class="trip-place-chip">${p}</div>`).join('')}
      </div>
    </div>`;
  }).join('');
}

// OPEN TRIP
let currentTrip=null;
function openTrip(id){
  currentTrip=TRIPS.find(t=>t.id===id);
  document.getElementById('detail-trip-name').textContent=currentTrip.name;
  document.getElementById('detail-trip-sub').textContent=currentTrip.dates+' · '+daysUntil(currentTrip.targetDate)+' days away';
  renderHighlights();renderBookings();loadReadiness();
  showDTab('highlights');
  document.getElementById('trip-detail').classList.add('open');
}
function closeDetail(){document.getElementById('trip-detail').classList.remove('open')}


function renderGallery(){
  const t = currentTrip;
  const d = ld();
  const galEl = document.getElementById('dtab-gallery');
  const places = t.highlights.map(h=>h.place);
  
  let html = '<div style="font-size:0.78rem;color:rgba(255,213,90,0.6);margin-bottom:16px;letter-spacing:1px">Tap a slot to add a photo. Long press to remove.</div>';
  
  places.forEach(place => {
    const key = t.id + '_gal_' + place.replace(/\s+/g,'_');
    const photos = d[key] || [];
    html += `<div class="gallery-place">
      <div class="gallery-place-name">${place}</div>
      <div class="gallery-grid">
        ${photos.map((src,i) => `<div class="gallery-cell" ontouchstart="galLongPress('${key}',${i},this)" ontouchend="galCancelLP()">
          <img src="${src}">
          <div class="del-overlay">×</div>
        </div>`).join('')}
        <div class="gallery-cell" onclick="galAdd('${key}')"><span class="add-icon">+</span></div>
      </div>
    </div>`;
  });
  galEl.innerHTML = '<div style="padding:16px 0">' + html + '</div>';
}

let galLPTimer = null;
function galLongPress(key, idx, el){
  galLPTimer = setTimeout(()=>{
    const d = ld();
    if(!d[key]) return;
    d[key].splice(idx,1);
    sv(d); renderGallery();
  }, 600);
}
function galCancelLP(){ if(galLPTimer){clearTimeout(galLPTimer);galLPTimer=null;} }

function galAdd(key){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  inp.onchange = e => {
    const file = e.target.files[0]; if(!file)return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const max=800; let w=img.width,h=img.height;
        if(w>h){if(w>max){h=Math.round(h*max/w);w=max;}}else{if(h>max){w=Math.round(w*max/h);h=max;}}
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        const d=ld(); if(!d[key])d[key]=[];
        d[key].push(canvas.toDataURL('image/jpeg',0.75));
        sv(d); renderGallery();
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  };
  inp.click();
}

function showDTab(name){
  document.querySelectorAll('.dtab-view').forEach(v=>v.style.display='none');
  document.querySelectorAll('.dtab').forEach(b=>b.classList.remove('active'));
  document.getElementById('dtab-'+name).style.display='block';
  if(name==='gallery')renderGallery();
  document.querySelectorAll('.dtab').forEach(b=>{if(b.textContent.toLowerCase()===name)b.classList.add('active')});
}

function renderHighlights(){
  const t=currentTrip;
  let html='';
  if(t.alert) html+=`<div class="alert-box">${t.alert}</div>`;
  t.highlights.forEach(section=>{
    html+=`<div class="place-section"><div class="place-name">${section.place}</div>`;
    section.items.forEach(item=>{
      html+=`<div class="highlight-item"><div class="hi-dot"></div><div class="hi-text">${item.text}</div></div>`;
    });
    html+='</div>';
  });
  document.getElementById('dtab-highlights').innerHTML=html;
}

function renderBookings(){
  const d=ld();
  const booked=d[currentTrip.id+'_bookings']||{};
  const html=currentTrip.bookings.map((b,i)=>{
    const done=!!booked[i];
    return `<div class="booking-item${done?' done-item':''}" onclick="toggleBooking(${i})">
      <div class="booking-check${done?' done':''}"></div>
      <div class="booking-text">${b.text}</div>
      <div class="booking-priority ${b.priority}">${b.priority.toUpperCase()}</div>
    </div>`;
  }).join('');
  document.getElementById('dtab-bookings').innerHTML=html||'<div style="font-size:0.85rem;color:rgba(255,213,90,0.55);padding:20px 0;text-align:center">No bookings listed.</div>';
}

function toggleBooking(idx){
  const d=ld();
  const key=currentTrip.id+'_bookings';
  if(!d[key])d[key]={};
  d[key][idx]=!d[key][idx];
  sv(d);renderBookings();
}

function loadReadiness(){
  const d=ld();
  document.getElementById('readiness-area').value=d[currentTrip.id+'_readiness']||'';
}
function saveReadiness(){
  const d=ld();
  d[currentTrip.id+'_readiness']=document.getElementById('readiness-area').value;
  sv(d);toast('Saved');
}

let tTimer;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(tTimer);tTimer=setTimeout(()=>t.classList.remove('show'),2000)}

renderList();

// EXPORT / IMPORT
// ═══════════════════════════════════════════════
const EI_KEYS = ['horizon_v2'];

function eiOpen(){{
  document.getElementById('ei-code-area').value='';
  document.getElementById('ei-copy-btn').style.display='block';
  document.getElementById('ei-confirm-btn').style.display='none';
  document.getElementById('ei-overlay').classList.add('show');
}}
function eiClose(){{document.getElementById('ei-overlay').classList.remove('show')}}

function eiExport(){{
  const data={};
  EI_KEYS.forEach(k=>{{const v=localStorage.getItem(k);if(v)data[k]=v;}});
  const code=btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  document.getElementById('ei-code-area').value=code;
  document.getElementById('ei-copy-btn').style.display='block';
  document.getElementById('ei-confirm-btn').style.display='none';
}}

function eiImportMode(){{
  document.getElementById('ei-code-area').value='';
  document.getElementById('ei-code-area').placeholder='Paste your backup code here...';
  document.getElementById('ei-copy-btn').style.display='none';
  document.getElementById('ei-confirm-btn').style.display='block';
}}

function eiCopy(){{
  const code=document.getElementById('ei-code-area').value;
  if(!code)return;
  navigator.clipboard.writeText(code).then(()=>{{
    document.getElementById('ei-copy-btn').textContent='Copied ✓';
    setTimeout(()=>document.getElementById('ei-copy-btn').textContent='Copy code',2000);
  }}).catch(()=>{{
    document.getElementById('ei-code-area').select();
    document.execCommand('copy');
  }});
}}

function eiConfirmImport(){{
  const code=document.getElementById('ei-code-area').value.trim();
  if(!code)return;
  try{{
    const data=JSON.parse(decodeURIComponent(escape(atob(code))));
    Object.entries(data).forEach(([k,v])=>localStorage.setItem(k,v));
    eiClose();
    setTimeout(()=>location.reload(),300);
  }}catch(e){{
    alert('Invalid backup code — please check and try again');
  }}
}}
</script>
<!-- EXPORT/IMPORT -->
<div id="ei-overlay" onclick="eiClose()">
  <div id="ei-box" onclick="event.stopPropagation()">
    <div class="ei-title">Data backup</div>
    <div class="ei-sub">Export your data as a code to back it up or move it to a new URL. Import to restore.</div>
    <div class="ei-btn-row">
      <button class="ei-action-btn ei-export-btn" onclick="eiExport()">⬆ Export</button>
      <button class="ei-action-btn ei-import-btn" onclick="eiImportMode()">⬇ Import</button>
    </div>
    <textarea id="ei-code-area" placeholder="Your backup code will appear here after export. Or paste an import code here."></textarea>
    <div class="ei-code-action-row">
      <button class="ei-copy-btn" id="ei-copy-btn" onclick="eiCopy()">Copy code</button>
      <button class="ei-confirm-btn" id="ei-confirm-btn" onclick="eiConfirmImport()">Restore data</button>
      <button class="ei-close-btn" onclick="eiClose()">Close</button>
    </div>
  </div>
</div>
